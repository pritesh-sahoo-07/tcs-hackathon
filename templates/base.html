{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CanteenAI — your campus food, intelligently recommended.">
  <title>{% block title %}CanteenAI{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="page-glow glow-one"></div><div class="page-glow glow-two"></div>
  <header class="site-header"><nav class="navbar navbar-expand-lg container py-2" aria-label="Primary navigation"><a class="brand navbar-brand mb-0" href="{% url 'home' %}"><span class="brand-mark"><i class="bi bi-stars"></i></span>CanteenAI</a><button class="navbar-toggler nav-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#primaryNav" aria-controls="primaryNav" aria-expanded="false" aria-label="Toggle navigation"><i class="bi bi-list"></i></button><div class="collapse navbar-collapse" id="primaryNav"><div class="navbar-nav ms-auto align-items-lg-center gap-lg-2"><a class="nav-link" href="{% url 'home' %}">Home</a><a class="nav-link" href="{% url 'menu' %}">Menu</a><a class="nav-link" href="{% url 'recommendation' %}">Recommend</a><a class="nav-link" href="{% url 'home' %}#about">How It Works</a><a class="btn btn-primary nav-cta ms-lg-3" href="{% url 'recommendation' %}">Get Recommendation</a></div></div></nav></header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer"><div class="container d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3"><div><a class="brand" href="{% url 'home' %}"><span class="brand-mark"><i class="bi bi-stars"></i></span>CanteenAI</a><p class="mb-0 mt-2">Smart food recommendations for campus life.</p></div><div class="footer-links"><a href="{% url 'home' %}">Home</a><a href="{% url 'menu' %}">Menu</a><a href="{% url 'recommendation' %}">Recommend</a><a href="{% url 'home' %}#about">How It Works</a></div><small>© 2026 CanteenAI</small></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/main.js' %}"></script>{% block extra_js %}{% endblock %}
</body></html>
